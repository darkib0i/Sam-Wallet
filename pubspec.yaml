name: aurora_wallet
description: "Aurora Wallet — a fictional wallet UI/UX benchmarking prototype (DEMO ONLY, not a real payment app)."
publish_to: "none"
version: 1.0.0+1

# Uses the Color.withValues API, which requires Flutter 3.27+ / Dart 3.6+.
environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (BLoC / Cubit)
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Typography — clean geometric sans in the spirit of One UI Sans (Inter is
  # open source / OFL licensed; we do NOT bundle any proprietary vendor font).
  google_fonts: ^6.2.1

  # Remote logos / artwork loaded from public CDNs (no local image assets).
  cached_network_image: ^3.4.1

  # Vector network logos fetched from the public simple-icons CDN.
  flutter_svg: ^2.0.10+1

  # Generic demo sound feedback.
  audioplayers: ^6.1.0

  # Shimmer effect for the "reveal" animation.
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Native splash generator (run manually, see README).
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  # No local image assets by design — all artwork is fetched from CDN URLs.

# ---------------------------------------------------------------------------
# Native splash configuration. Generate with:
#   dart run flutter_native_splash:create
# ---------------------------------------------------------------------------
flutter_native_splash:
  color: "#0B0B0F"
  color_dark: "#0B0B0F"
  android_12:
    color: "#0B0B0F"
    color_dark: "#0B0B0F"
  fullscreen: true
